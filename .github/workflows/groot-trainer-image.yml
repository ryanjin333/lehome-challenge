name: GR00T images

on:
  workflow_dispatch:
    inputs:
      publish:
        required: true
        type: boolean
        default: false
      run_gpu:
        required: true
        type: boolean
        default: false

env:
  ROLLOUT_IMAGE_REPOSITORY: docker.io/ryanjin333/behavior1k-groot-n17-rollout

jobs:
  cpu-safe:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.8.22"
          enable-cache: false
      - name: Verify frozen rollout contract
        run: |
          uv lock --check --project rollout
          uv run --project rollout --frozen pytest \
            rollout/tests/test_image_contract.py::test_rollout_image_installs_groot_without_reusing_uv_archive_links -q
          bash -n rollout/entrypoint.sh rollout/scripts/verify-image.sh

  publish-rollout-candidate:
    if: inputs.publish
    needs: cpu-safe
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: rollout/Dockerfile
          target: rollout-runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.ROLLOUT_IMAGE_REPOSITORY }}:${{ github.sha }}
          build-args: |
            REPOSITORY_COMMIT=${{ github.sha }}
            BEHAVIOR_PARENT_IMAGE=stanfordvl/behavior@sha256:b789b8d8efefda509b37404a676523d6cee81e2860558287cf6c34c2af3b79c7
            BEHAVIOR_PARENT_DIGEST=sha256:b789b8d8efefda509b37404a676523d6cee81e2860558287cf6c34c2af3b79c7
      - name: Verify immutable registry publication
        env:
          OCI_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$OCI_DIGEST"
          docker buildx imagetools inspect "${ROLLOUT_IMAGE_REPOSITORY}@${OCI_DIGEST}"
