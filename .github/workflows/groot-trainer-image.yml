name: GR00T trainer image

on:
  pull_request:
    paths:
      - "trainer/**"
      - ".dockerignore"
      - ".github/workflows/groot-trainer-image.yml"
  push:
    branches: [main]
    paths:
      - "trainer/**"
      - ".dockerignore"
      - ".github/workflows/groot-trainer-image.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the immutable git-SHA candidate to GHCR"
        required: true
        type: boolean
        default: false
      run_gpu:
        description: "Queue the explicit self-hosted single-GPU structural gate"
        required: true
        type: boolean
        default: false
      publish_runtime_pilot:
        description: "Publish the immutable CPU runtime-pilot image to GHCR"
        required: true
        type: boolean
        default: false

env:
  IMAGE_REPOSITORY: ghcr.io/ryanjin333/lehome-groot-n17-trainer

jobs:
  cpu-safe:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.22"
          enable-cache: false
      - name: Install CPU converter system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify frozen trainer lock and CPU suite
        working-directory: trainer
        run: |
          uv sync --frozen
          PYTHONPATH=../source/lehome:.. uv run --frozen --with numpy==1.26.0 \
            pytest tests --ignore=tests/test_groot_runtime_gate.py -q
          uv lock --check
      - name: Reject tracked secrets and large artifacts
        shell: bash
        run: |
          set -euo pipefail
          scan_output=$(mktemp)
          trap 'rm -f "$scan_output"' EXIT
          set +e
          git grep -nE \
            'hf_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{30,}' \
            -- . ':(exclude)trainer/tests/**' >"$scan_output"
          scanner_status=$?
          set -e
          if [[ "$scanner_status" -eq 0 ]]; then
            echo "tracked credential-like material found" >&2
            exit 1
          fi
          if [[ "$scanner_status" -ne 1 ]]; then
            echo "credential scanner failed with status $scanner_status" >&2
            exit "$scanner_status"
          fi
          set +e
          large=$(find . -type f -size +25M \
            -not -path './.git/*' \
            -not -path './trainer/.venv/*' \
            -print -quit)
          scanner_status=$?
          set -e
          if [[ "$scanner_status" -ne 0 ]]; then
            echo "large-file scanner failed with status $scanner_status" >&2
            exit "$scanner_status"
          fi
          test -z "$large" || { echo "unexpected tracked-scale artifact: $large" >&2; exit 1; }
      - name: Validate shell helpers
        run: bash -n trainer/docker/entrypoint.sh trainer/scripts/build-image.sh trainer/scripts/verify-image.sh

  publish-candidate:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: cpu-safe
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.IMAGE_REPOSITORY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=${{ github.sha }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: trainer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            ${{ steps.metadata.outputs.labels }}
            io.lehome.release-mode=release
          build-args: |
            REPOSITORY_COMMIT=${{ github.sha }}
      - name: Verify the published digest structurally on CPU
        env:
          OCI_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_REPOSITORY}@${OCI_DIGEST}"
          trainer/scripts/verify-image.sh "${IMAGE_REPOSITORY}@${OCI_DIGEST}"
      - name: Resolve and validate pending release manifest
        env:
          OCI_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          PYTHONPATH=trainer/src python3 -m lehome_train.release_manifest \
            --repository-commit "${GITHUB_SHA}" \
            --trainer-lock-path trainer/uv.lock \
            --oci-digest "$OCI_DIGEST" \
            --output release-manifest.json
          PYTHONPATH=trainer/src python3 -c \
            'from lehome_train.release_manifest import load_release_manifest; load_release_manifest("release-manifest.json")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unreleased-image-manifest-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error

  publish-runtime-pilot:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_runtime_pilot
    needs: cpu-safe
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    env:
      RUNTIME_PILOT_TAG: runtime-pilot-${{ github.sha }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.IMAGE_REPOSITORY }}
      image_ref: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
      tag: runtime-pilot-${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=runtime-pilot-${{ github.sha }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: trainer/Dockerfile.runtime-pilot
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            REPOSITORY_COMMIT=${{ github.sha }}
      - name: Pull and smoke the runtime pilot at its exact digest
        env:
          OCI_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE_REPOSITORY}@${OCI_DIGEST}"
          docker pull "${IMAGE_REPOSITORY}@${OCI_DIGEST}"
          actual_revision=$(docker image inspect "$image_ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$actual_revision" = "$GITHUB_SHA"
          docker run --rm --entrypoint /bin/bash "$image_ref" -euo pipefail -c "$(cat <<'RUNTIME_PILOT_SMOKE'
          test "$(uname -m)" = "x86_64"
          test "$(dpkg --print-architecture)" = "amd64"
          /opt/runtime/bin/python - <<'PYTHON'
          import sys
          import torch
          import torchcodec
          import torchvision

          assert sys.version_info[:3] == (3, 10, 18), sys.version
          assert torch.__version__ == "2.7.1+cpu", torch.__version__
          assert torch.version.cuda is None, torch.version.cuda
          assert not torch.cuda.is_available()
          assert torchvision.__version__ == "0.22.1+cpu", torchvision.__version__
          assert torchcodec.__version__ == "0.4.0", torchcodec.__version__
          PYTHON
          test "$(git -C /opt/isaac-groot rev-parse HEAD)" = "23ace64f17aa5015259b8609d371eb61a357c776"
          test "$(sha256sum /opt/isaac-groot/gr00t/model/gr00t_n1d7/setup.py | awk '{print $1}')" = "bdc3cf8a6b9c92a0e3f46d79dc3de05b0a8c70c4289d44ac0aa1c75698a93f31"
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
          lehome-train --help >/dev/null
          test -z "$(find / -xdev -type f \( -name '*.safetensors' -o -name '*.ckpt' \) -print -quit)"
          RUNTIME_PILOT_SMOKE
          )"
      - name: Write runtime-pilot publication receipt
        env:
          OCI_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            printf 'repository=%s\n' "$IMAGE_REPOSITORY"
            printf 'tag=%s\n' "$RUNTIME_PILOT_TAG"
            printf 'digest=%s\n' "$OCI_DIGEST"
            printf 'git_sha=%s\n' "$GITHUB_SHA"
            printf 'smoke_result=passed\n'
          } > runtime-pilot-image.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-pilot-image-${{ github.sha }}
          path: runtime-pilot-image.txt
          if-no-files-found: error

  gpu-structural:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.run_gpu
    needs: publish-candidate
    runs-on: [self-hosted, linux, x64, gpu, groot-trainer]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull exact registry digest
        run: docker pull "${{ needs.publish-candidate.outputs.image }}@${{ needs.publish-candidate.outputs.digest }}"
      - name: Verify exactly one GPU and one synthetic optimizer step
        run: >-
          trainer/scripts/verify-image.sh --gpu
          "${{ needs.publish-candidate.outputs.image }}@${{ needs.publish-candidate.outputs.digest }}"

# The uploaded manifest deliberately remains `unreleased`. The full fresh RTX
# PRO 6000 acceptance sequence in trainer/README.md must be completed and its
# evidence recorded before a maintainer can commit an `accepted` manifest.
