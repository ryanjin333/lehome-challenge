[project]
name = "lehome-runtime-pilot"
version = "0.1.0"
description = "Pinned CPU-only native-x86 GR00T runtime-mixture loader pilot"
requires-python = "==3.10.18"
dependencies = [
    "av==16.1.0",
    "click==8.1.8",
    "huggingface-hub==0.36.2",
    "numpy==1.26.4",
    "opencv-python-headless==4.11.0.86",
    "pyarrow==23.0.1",
    "torch==2.7.1+cpu",
    "torchcodec==0.4.0",
    "torchvision==0.22.1+cpu",
    "typer==0.16.1",
]

[tool.uv]
package = false
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
