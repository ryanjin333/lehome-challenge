[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "b1k-rollout"
version = "0.1.0"
description = "Immutable BEHAVIOR-1K GR00T rollout contracts"
requires-python = ">=3.10,<3.14"
dependencies = ["huggingface_hub==0.36.2"]

[project.scripts]
b1k-rollout = "b1k_rollout.cli:main"

[dependency-groups]
dev = ["pytest==8.4.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/b1k_rollout"]
