[project]
name = "lehome"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "isaacsim[all,extscache]==5.1.0",
    "lerobot==0.4.3",
    "msgpack==1.1.0",
    "num2words>=0.5.14",
    "open3d>=0.19.0",
    "pinocchio>=0.4.3",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "transformers>=4.57.6",
    "transforms3d>=0.4.2",
    "pyzmq==27.0.1",
]
[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
override-dependencies = [
    "packaging==23.0",
    "numpy==1.26.0",
]

[tool.uv.sources]
# The RTX Pro 6000 is Blackwell (SM 12.0); ordinary PyPI's CUDA 12.6 wheel
# cannot execute on it.  The public N1.5 runtime is pinned to the matching
# official PyTorch CUDA 12.8 build below.
torch = [{ index = "pytorch" }]
torchvision = [{ index = "pytorch" }]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
